<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stroke route tests</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 20px; max-width: 980px; }
  .pass { color: #0a7d32; } .fail { color: #b3261e; font-weight: 700; }
  h1 { font-size: 18px; } pre { background: #f5f6f8; padding: 10px; overflow: auto; }
  #summary { font-weight: 700; margin: 12px 0; padding: 8px; background: #f0f1f4; }
  canvas { border: 1px solid #ddd; }
</style>
</head>
<body>
<h1>Writing route: does the skeleton land on the letter?</h1>
<p>Needs a browser: it rasterises each glyph and tests the fitted route against
that raster. Open it and read the panel, or drive it headlessly and read
<code>window.__UTG_TEST</code>.</p>
<div id="summary">running…</div>
<pre id="out"></pre>
<canvas id="stage" width="400" height="480"></canvas>

<script src="/js/printables/strokeDirectionData.js"></script>
<script src="/js/printables/glyphMetrics.js"></script>
<script>
/*
 * R-001 turned the dotted tracing levels from a stroked glyph CONTOUR into a
 * writing centreline, and R-010 fitted the stroke-direction overlay the same
 * way. Both stand on one claim that nothing else in this repo can check:
 * the skeleton in strokeDirectionData.js, fitted to a glyph's measured ink,
 * actually lies ON that glyph.
 *
 * It is not checkable by reading code or by a node test — the skeleton is
 * hand-authored against a generic sans and the glyph is a real webfont, so
 * the only honest answer is to draw the letter and look at the pixels. That
 * is what this does: draw at the same size and baseline production uses, fit
 * with the same fitSkeleton call, resample the route by arc length, and count
 * the share of it that lands on ink.
 *
 * The threshold is 90% per letter and 97% mean. Measured when this was
 * written: 99.3% mean, worst letter 90% (R). A letter that drifts below is a
 * real regression in the data or in the fit, not noise — the measurement is
 * deterministic.
 */
(function () {
  "use strict";
  const lines = [];
  let pass = 0, fail = 0;
  function ok(cond, label, detail) {
    if (cond) { pass++; lines.push("PASS  " + label); }
    else { fail++; lines.push("FAIL  " + label + (detail ? "   " + detail : "")); }
  }

  const FAM = "Quicksand";
  const F = "Quicksand, 'Plus Jakarta Sans', sans-serif";
  const SIZE = 210;          // outlineSVG's own font-size, the skeleton's unit
  const BASE = 300;          // baseline inside the test canvas
  const CX = 200;

  function finish() {
    document.getElementById("out").textContent = lines.join("\n");
    const el = document.getElementById("summary");
    el.textContent = pass + " passed, " + fail + " failed";
    el.className = fail ? "fail" : "pass";
    window.__UTG_TEST = { pass: pass, fail: fail, lines: lines, summary: el.textContent };
  }

  /* Draw one glyph and return an ink test. Production places the letter with
     text-anchor=middle, so the raster is produced the same way and the ink box
     handed to fitSkeleton is the one glyphMetrics computes — not one read back
     off the raster. Testing the fit against a box derived from the same
     measurement it uses would prove nothing; the raster is the independent
     half. */
  function raster(ch) {
    const c = document.getElementById("stage");
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.font = "700 " + SIZE + "px " + F;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#000";
    ctx.fillText(ch, CX, BASE);
    const d = ctx.getImageData(0, 0, c.width, c.height).data;
    return function (x, y) {
      const px = Math.round(x), py = Math.round(y);
      if (px < 0 || py < 0 || px >= c.width || py >= c.height) return false;
      const i = (py * c.width + px) * 4;
      return (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) < 170;
    };
  }

  function run() {
    const gm = window.UltraTextGen.glyphMetrics;
    const DATA = window.UTG_STROKE_DIRECTION_DATA;
    gm.reset();

    /* Measuring the wrong face passes by coincidence on the letters whose
       schematic happens to suit a fallback sans and fails on the rest, which
       is worse than not running. */
    const have = document.fonts && document.fonts.check('700 ' + SIZE + 'px "' + FAM + '"');
    if (!have) {
      lines.push("ABORT  " + FAM + " is not available — every number below would be meaningless.");
      fail++; finish(); return;
    }
    ok(!!DATA && Object.keys(DATA).length === 52, "strokeDirectionData covers 52 letters",
       "got " + (DATA ? Object.keys(DATA).length : 0));

    // ---- the arithmetic, before the geometry ---------------------------
    const mapped = gm.mapPath("M10,20 C30,40 50,60 70,80", 2, 3, 5, 7);
    ok(mapped === "M25,67 C65,127 105,187 145,247", "mapPath scales and translates every pair",
       "got " + mapped);
    ok(/^M/.test(mapped) && mapped.indexOf("C") > 0, "mapPath keeps the command letters");

    const stem = gm.stemWidth(F, SIZE, 700);
    ok(stem > SIZE * 0.08 && stem < SIZE * 0.22, "stemWidth is a plausible stem at 210px",
       "got " + stem.toFixed(1));

    const runs = gm.flattenStrokes(["M0,0 C0,100 100,100 100,0"], 12);
    const box = gm.runsBox(runs);
    ok(box.h < 76 && box.h > 70, "flattenStrokes measures the CURVE, not its control hull",
       "cubic peaks at 75 of a 100-unit hull; got " + box.h.toFixed(1));

    /* A single vertical has no width to match, so the fit centres it instead
       of scaling by zero — "l" and "i" are the whole class. */
    const vert = gm.fitSkeleton(["M100,52 L100,198"], { x: 40, y: 20, w: 60, h: 200 }, { inset: 10 });
    ok(vert && vert.sx === 1, "fitSkeleton keeps scale 1 on a degenerate axis");
    ok(vert && Math.abs(gm.runsBox(gm.flattenStrokes(vert.d, 12)).x - 70) < 0.6,
       "fitSkeleton centres a degenerate axis on the ink box");

    // ---- the route lands on the letter ---------------------------------
    const chars = Object.keys(DATA);
    const scores = [];
    chars.forEach(function (ch) {
      const hit = raster(ch);
      const i = gm.ink(ch, F, SIZE, 700);
      if (!i || !i.exact) { scores.push({ ch: ch, pct: 0, note: "no ink metrics" }); return; }
      const originX = CX - i.advance / 2;
      const inkBox = { x: originX + i.left, y: BASE + i.top, w: i.width, h: i.height };
      const fit = gm.fitSkeleton(DATA[ch].strokes, inkBox, { inset: stem / 2 });
      if (!fit) { scores.push({ ch: ch, pct: 0, note: "no fit" }); return; }
      /* Resampled by arc length, so a 24-segment curve and one straight line
         do not weigh the same. */
      const rs = gm.flattenStrokes(fit.d, 24);
      let n = 0, on = 0;
      rs.forEach(function (run) {
        for (let k = 1; k < run.length; k++) {
          const a = run[k - 1], b = run[k];
          const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
          const steps = Math.max(1, Math.round(len / 1.5));
          for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            n++;
            if (hit(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t)) on++;
          }
        }
      });
      scores.push({ ch: ch, pct: n ? 100 * on / n : 0 });
    });

    const worst = scores.slice().sort(function (a, b) { return a.pct - b.pct; });
    const mean = scores.reduce(function (s, r) { return s + r.pct; }, 0) / scores.length;
    lines.push("");
    lines.push("route on letter, worst 10: " + worst.slice(0, 10)
      .map(function (r) { return r.ch + " " + r.pct.toFixed(0) + "%"; }).join("  "));
    lines.push("mean " + mean.toFixed(1) + "%");
    lines.push("");

    ok(mean >= 97, "mean route coverage is at least 97%", "got " + mean.toFixed(1) + "%");
    const below = scores.filter(function (r) { return r.pct < 90; });
    ok(below.length === 0, "every letter's route is at least 90% on the glyph",
       below.map(function (r) { return r.ch + " " + r.pct.toFixed(0) + "%"; }).join(", "));

    /* The registry's own claim, as a shape rather than an average: a stem gets
       ONE column of route, not one per contour edge. "l" is the clean case —
       a single vertical, so every sample must share one x. */
    const lFit = (function () {
      const i = gm.ink("l", F, SIZE, 700);
      const originX = CX - i.advance / 2;
      return gm.fitSkeleton(DATA.l.strokes,
        { x: originX + i.left, y: BASE + i.top, w: i.width, h: i.height }, { inset: stem / 2 });
    })();
    const lx = gm.flattenStrokes(lFit.d, 12).reduce(function (a, r) { return a.concat(r); }, [])
      .map(function (p) { return p[0]; });
    ok(Math.max.apply(null, lx) - Math.min.apply(null, lx) < 1,
       "a stem's route is one column, not its two contour edges",
       "spread " + (Math.max.apply(null, lx) - Math.min.apply(null, lx)).toFixed(2));

    finish();
  }

  /* Canvas measureText does NOT pull a webfont in, so asking for it explicitly
     is the only way to be measuring the face the sheet will actually print. */
  function boot() {
    const load = document.fonts && document.fonts.load
      ? document.fonts.load('700 ' + SIZE + 'px "' + FAM + '"').catch(function () {})
      : Promise.resolve();
    load.then(function () { return document.fonts ? document.fonts.ready : null; })
        .catch(function () {})
        .then(run, run);
  }
  if (document.readyState === "complete") boot();
  else window.addEventListener("load", boot);
})();
</script>
</body>
</html>
