    <text x="242" y="86" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="24"
          fill="#64748b" text-anchor="middle">plain</text>
    <line x1="50" y1="292" x2="310" y2="292" stroke="#64748b" stroke-width="3"
