<body class="embed-widget-body">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P55HXK8Q"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="embed-wrapper">
    <div class="hero-card">
      <h1 class="hero-headline">Zalgo Text Generator</h1>
      <p class="hero-tagline">Cursed glitch text: pick an intensity, type, copy.</p>

      <div class="input-wrapper">
        <textarea class="main-input" id="mainInput" placeholder="Type something cursed..." maxlength="60" aria-label="Text to turn into Zalgo">hello</textarea>
        <span class="char-count"><span id="charCount">5</span>/60</span>
      </div>

      <!-- Intensity Presets -->
      <div class="helper-section">
        <div class="helper-section-title" id="presetLabel">Intensity: click to choose</div>
        <div class="decoration-tabs decoration-tabs--wrap" id="presetTabs" role="group" aria-labelledby="presetLabel">
          <button class="decoration-tab" data-preset="subtle" type="button" aria-pressed="false">Subtle</button>
          <button class="decoration-tab active" data-preset="classic" type="button" aria-pressed="true">Classic</button>
          <button class="decoration-tab" data-preset="cursed" type="button" aria-pressed="false">Cursed</button>
          <button class="decoration-tab" data-preset="chaos" type="button" aria-pressed="false">HE COMES</button>
          <button class="decoration-tab" data-preset="tinystack" type="button" aria-pressed="false">Tiny Stack</button>
          <button class="decoration-tab" data-preset="cascade" type="button" aria-pressed="false">Thai Cascade</button>
          <button class="decoration-tab" data-preset="invader" type="button" aria-pressed="false">Post Invader</button>
        </div>
      </div>

      <!-- Live Output -->
      <div class="style-card" id="zalgoOutputCard">
        <div class="style-info">
          <div class="style-name" id="zalgoOutputName">Classic</div>
          <div class="style-preview" id="zalgoOutput"></div>
        </div>
        <button class="copy-btn" id="zalgoCopyBtn" type="button" aria-label="Copy Zalgo text">Copy</button>
      </div>
    </div>

    <!-- Variations -->
    <div class="embed-variations">
      <h2>More Flavors</h2>
      <div id="variationsGrid">
        <div class="variations-placeholder">Type something above to curse it</div>
      </div>
    </div>

    <span class="sr-only" id="copyStatus" aria-live="polite"></span>

    <!-- Attribution -->
    <div class="embed-attribution">
      <a href="https://ultratextgen.com/usecase/zalgo-text/?utm_source=embed&utm_medium=widget&utm_campaign=zalgo_text" target="_blank" rel="noopener nofollow">Zalgo Text Generator</a> by <a href="https://ultratextgen.com/?utm_source=embed&utm_medium=widget&utm_campaign=zalgo_text" target="_blank" rel="noopener nofollow">UltraTextGen</a>
    </div>
  </div>

  <script src="/usecase/zalgo-text/zalgo-text.js"></script>
  <script>
    // The engine is the tool page's own (window.UTGZalgoEngine, from
    // /usecase/zalgo-text/zalgo-text.js), never a copy: marks go after whole
    // characters, so emoji and flags are never split, and the cascade has the
    // same marks and carriers as the full generator.
    const { generateZalgo, generateCascade } = window.UTGZalgoEngine;

    // ── Presets (intensity picker) ──────────────────────────────────
    const PRESETS = [
      { id: 'subtle',    label: 'Subtle',
        settings: { charType: 'all', position: 'up-down', shape: 'uniform', frequency: 0.5, amplitude: 2 } },
      { id: 'classic',   label: 'Classic',
        settings: { charType: 'all', position: 'all', shape: 'uniform', frequency: 0.8, amplitude: 5 } },
      { id: 'cursed',    label: 'Cursed',
        settings: { charType: 'all', position: 'all', shape: 'uniform', frequency: 0.95, amplitude: 9 } },
      { id: 'chaos',     label: 'HE COMES',
        settings: { charType: 'all', position: 'all', shape: 'uniform', frequency: 1.0, amplitude: 18 } },
      { id: 'tinystack', label: 'Tiny Stack',
        settings: { charType: 'letters', position: 'up', shape: 'uniform', frequency: 1.0, amplitude: 1 } },
      { id: 'cascade',   label: 'Thai Cascade', cascade: { anchor: 'thai', placement: 'prefix', depth: 60 } },
      // The "invade the post above" look from X: a tall stack on the kaomoji
      // (つ ค c ) under the text.
      { id: 'invader',   label: 'Post Invader', cascade: { anchor: 'kaomoji', placement: 'suffix', depth: 230 } }
    ];

    // ── Output Variants (More Flavors grid) ─────────────────────────
    const VARIANTS = [
      { id: 'updown', label: 'Up & Down',
        opts: { charType: 'all', position: 'up-down', shape: 'uniform', frequency: 0.9, amplitude: 5 } },
      { id: 'spires', label: 'Spires',
        opts: { charType: 'all', position: 'up', shape: 'uniform', frequency: 1, amplitude: 6 } },
      { id: 'roots', label: 'Roots',
        opts: { charType: 'all', position: 'down', shape: 'uniform', frequency: 1, amplitude: 6 } },
      { id: 'strike', label: 'Strikethrough',
        opts: { charType: 'all', position: 'mid', shape: 'uniform', frequency: 1, amplitude: 2 } },
      { id: 'tiny', label: 'Tiny Stack',
        opts: { charType: 'letters', position: 'up', shape: 'uniform', frequency: 1, amplitude: 1 } }
    ];

    // ── DOM references ──────────────────────────────────────────────
    const mainInput = document.getElementById('mainInput');
    const charCount = document.getElementById('charCount');
    const presetTabs = document.querySelectorAll('#presetTabs [data-preset]');
    const zalgoOutput = document.getElementById('zalgoOutput');
    const zalgoOutputCard = document.getElementById('zalgoOutputCard');
    const zalgoOutputName = document.getElementById('zalgoOutputName');
    const zalgoCopyBtn = document.getElementById('zalgoCopyBtn');
    const variationsGrid = document.getElementById('variationsGrid');

    const copyStatus = document.getElementById('copyStatus');

    let activePreset = 'classic';

    // ── Analytics (dataLayer only; never breaks the widget) ─────────
    // Where the widget is running: 'preview' is our own /embed/ landing page
    // iframing it, 'third_party' is someone else's site, 'direct' is the
    // widget URL opened on its own. On the preview the row goes to the
    // landing page's dataLayer, so "tried the widget" and "copied the embed
    // code" are read off one page's funnel. On a third-party site it stays in
    // this document and carries the host's hostname (never the full URL).
    const WIDGET_CONTEXT = (() => {
      if (window.parent === window) return 'direct';
      try {
        return window.parent.location.hostname === window.location.hostname ? 'preview' : 'third_party';
      } catch (e) { return 'third_party'; }
    })();
    const WIDGET_HOST = (() => {
      if (WIDGET_CONTEXT !== 'third_party') return '';
      try { return document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) { return ''; }
    })();
    let typedOnce = false;

    function trackInteraction(action, preset) {
      try {
        const target = WIDGET_CONTEXT === 'preview' ? window.parent : window;
        target.dataLayer = target.dataLayer || [];
        target.dataLayer.push({
          event: 'zalgo_widget_interaction',
          widget_action: action,
          widget_preset: preset,
          widget_context: WIDGET_CONTEXT,
          widget_host: WIDGET_HOST
        });
      } catch (e) { /* analytics must never break the widget */ }
    }

    // ── Clipboard helper (button feedback) ──────────────────────────
    function copyWithFeedback(text, btn, onCopied) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        if (onCopied) onCopied();
        copyStatus.textContent = 'Copied to clipboard';
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
          copyStatus.textContent = '';
        }, 1500);
      });
    }

    // ── Char counter (counts input chars typed, not output length) ──
    function updateCharCount() {
      charCount.textContent = mainInput.value.length;
    }

    // ── Main live output ────────────────────────────────────────────
    function renderMain() {
      const preset = PRESETS.find(p => p.id === activePreset) || PRESETS[1];
      zalgoOutputName.textContent = preset.label;

      const text = mainInput.value.trim();
      if (!text) {
        zalgoOutput.classList.add('placeholder');
        zalgoOutputCard.classList.remove('is-cascade');
        zalgoOutput.textContent = 'Type something above to curse it';
        return;
      }
      zalgoOutput.classList.remove('placeholder');
      // The cascade paints far above its line; the card clips it (CSS) and
      // the copy button still copies the full string.
      zalgoOutputCard.classList.toggle('is-cascade', !!preset.cascade);
      zalgoOutput.textContent = preset.cascade ? generateCascade(text, preset.cascade) : generateZalgo(text, preset.settings);
    }

    // ── Variations grid ─────────────────────────────────────────────
    function renderVariations() {
      const text = mainInput.value.trim();
      if (!text) {
        variationsGrid.innerHTML = '<div class="variations-placeholder">Type something above to curse it</div>';
        return;
      }

      variationsGrid.innerHTML = '';

      VARIANTS.forEach(variant => {
        const result = generateZalgo(text, variant.opts);

        const card = document.createElement('div');
        card.className = 'style-card';

        const info = document.createElement('div');
        info.className = 'style-info';

        const name = document.createElement('div');
        name.className = 'style-name';
        name.textContent = variant.label;

        const preview = document.createElement('div');
        preview.className = 'style-preview';
        preview.textContent = result;

        info.appendChild(name);
        info.appendChild(preview);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.type = 'button';
        copyBtn.setAttribute('aria-label', 'Copy ' + variant.label + ' Zalgo text');
        copyBtn.addEventListener('click', () => copyWithFeedback(result, copyBtn,
          () => trackInteraction('copy_variant', variant.id)));

        card.appendChild(info);
        card.appendChild(copyBtn);
        variationsGrid.appendChild(card);
      });
    }

    // ── Render everything for the current input/preset ──────────────
    function renderAll() {
      renderMain();
      renderVariations();
    }

    // ── Events ──────────────────────────────────────────────────────
    presetTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        presetTabs.forEach(t => {
          t.classList.remove('active');
          t.setAttribute('aria-pressed', 'false');
        });
        tab.classList.add('active');
        tab.setAttribute('aria-pressed', 'true');
        activePreset = tab.dataset.preset;
        renderMain();
        trackInteraction('preset', activePreset);
      });
    });

    mainInput.addEventListener('input', () => {
      updateCharCount();
      renderAll();
      if (!typedOnce) {
        typedOnce = true;
        trackInteraction('type', activePreset);
      }
    });

    zalgoCopyBtn.addEventListener('click', () => {
      if (zalgoOutput.classList.contains('placeholder')) return;
      copyWithFeedback(zalgoOutput.textContent, zalgoCopyBtn,
        () => trackInteraction('copy', activePreset));
    });

    // ── Init ────────────────────────────────────────────────────────
    updateCharCount();
    renderAll();
  </script>
</body></html>
