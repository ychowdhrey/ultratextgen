name: Workflow Lint

# Why this is its own workflow instead of a step inside validate.yml
# -----------------------------------------------------------------
# An unparseable workflow disappears from the PR's checks list — the list
# merges gate on. On `push` GitHub records a failed run (named after the file
# path, since the `name:` is inside the file it could not parse); on
# `pull_request` it records nothing at all, because that trigger is also
# inside the unparsed file. validate.yml stopped parsing on 2026-08-07 (an
# `if:` at column 0 plus a `run: |` folded onto the line above) and nothing
# noticed for a day — every PR merged in that window, including a 22-page
# locale batch, went unchecked, while red marks piled up in the Actions tab
# where nobody was looking.
#
# A step inside validate.yml cannot catch validate.yml failing to parse. So the
# lint runs from here as well, and validate.yml runs it too: whichever of the
# two still parses reports on the one that doesn't. Keep this file small and
# boring — it is the thing that has to survive when the big one breaks.
#
# It runs on every PR regardless of paths. A workflow can be broken by a merge
# it wasn't part of, and this job takes a few seconds.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  workflow-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      # Deliberately NOT continue-on-error: a workflow that doesn't parse, or a
      # piped step with no pipefail, is the failure that hides every other
      # failure. This one gates.
      - name: Lint GitHub Actions workflows
        run: python3 scripts/check-workflows.py
