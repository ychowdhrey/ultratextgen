name: Weekly Claude Report Card

on:
  schedule:
    - cron: "17 9 * * 0"
      timezone: "Asia/Kuala_Lumpur"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-reportcard
  cancel-in-progress: false

jobs:
  reportcard:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: ".github/prompts/reportcard-weekly.md"
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh pr:*)"

      - name: Check for report card changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- reportcard.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create report card pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="automation/reportcard-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add reportcard.md
          git commit -m "docs: weekly report card update"
          git push origin "$BRANCH"

          gh pr create             --base main             --head "$BRANCH"             --title "docs: weekly report card update"             --body "Weekly Claude Code review of newly merged UltraTextGen work. This PR updates reportcard.md only when recent changes created meaningful user facing improvements. Please review before merging."
