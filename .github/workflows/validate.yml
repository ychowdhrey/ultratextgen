name: Validate Site

# Required, blocking checks for structural correctness that must never merge
# broken: hreflang reciprocity, hreflang cluster completeness (every member
# of a cluster links every other member — a distinct check from reciprocity,
# see scripts/audit-hreflang-completeness.js's own header comment for why
# pairwise reciprocity alone misses mutual omissions), /library/ and
# /symbol/ page structure, the Funding Choices ad-blocking-recovery tag,
# per-page social/Pinterest image assets,
# new/changed pages' image assets specifically, new/changed /symbol/ pages'
# Related-Symbols peer-link reciprocity, translation parity — an EN <->
# locale content change introduced by this PR without its sibling being
# updated — locale mesh health (hreflang reciprocity + locale-native
# internal links on any locale page this PR touches), the locale-parent-gap
# pre-build check on any new locale page, FAQ schema visibility
# (FAQPage/QAPage JSON-LD whose questions aren't actually on the page), and
# the external-reference check (no tracked file may point readers at a repo,
# doc or tool that isn't published here — see scripts/check-external-refs.js
# for why a dangling pointer is worse than none). Each
# validator already exits non-zero on failure (see scripts/audit-hreflang.js,
# scripts/audit-hreflang-completeness.js,
# scripts/validate_library_pages.py, scripts/check-image-assets.py,
# scripts/check-new-page-image-assets.py,
# scripts/check-new-symbol-peer-links.py,
# scripts/check-translation-parity.js, scripts/check-locale-mesh.js,
# scripts/check-locale-parent-gap.js, scripts/check-faq-schema.js,
# scripts/check-locale-translation.js,
# scripts/check-funding-choices.js, scripts/check-external-refs.js) — this
# workflow is what actually wires that into CI so a PR can't merge broken
# pages.
#
# That wiring was inert from the day it was written until 2026-08-06: every
# step pipes into `| tee`, and a pipeline exits with its LAST command's status,
# so `tee` succeeding masked every validator's failure and `steps.<id>.outcome`
# was always 'success'. See the `defaults.run.shell` block on the job below —
# do not remove it. Consequence worth remembering: a green "Validate Site" on
# any PR before that date carries no information.
#
# scripts/check-image-assets.py is a whole-site audit (also requires a
# Pinterest pin per page) and the site carries a large, deliberately-paced
# Pinterest-pin backlog — so its "failure" step below is informational, not
# gating (see the step's own comment). scripts/check-new-page-image-assets.py
# is the actual gate for this: diff-scoped to only the pages this PR adds or
# changes, checking just og:image/twitter:image/hero (not Pinterest pins), so
# pre-existing site-wide backlog can never make it permanently red. This
# exists specifically to stop new pages shipping ahead of their hero/OG art —
# a recurring pattern confirmed from live GSC crawl-stats data.
#
# scripts/sync_symbol_spoke_links.py --check (no --write) is likewise a
# whole-site audit — it reports every /symbol/ page whose declared "Related
# Symbols" peer relation isn't reciprocated, alongside the existing hub-orphan
# check — so its step below is informational only; hub-orphans are already
# gated separately by scripts/validate_library_pages.py, and peer-link
# backlog (real at the time this was added, since fixed in the same PR) is a
# dashboard, not a per-PR blocker on its own. scripts/check-new-symbol-peer-
# links.py is the actual gate: diff-scoped to only /symbol/ pages this PR
# adds or changes, so a newly-introduced one-directional peer relation can't
# merge silently, without pre-existing backlog elsewhere ever contributing to
# a failure. Fix is always scripts/sync_symbol_spoke_links.py --write
# --reciprocal (also npm run sync:symbol-peer-links).
#
# scripts/audit-locale-parent-gap.js is likewise a whole-site discovery pass
# (which Core-parent x qualified-locale cells have near-zero translation
# coverage and no recorded pre-build gap check) and stays informational for
# the same reason check-image-assets.py does: the site carries a real,
# deliberately-paced locale-translation backlog, so this can't be a per-PR
# gate without being permanently red. scripts/check-locale-mesh.js and
# scripts/check-locale-parent-gap.js are the diff-scoped gates that actually
# enforce mesh health and the pre-build gap check on what a PR adds/changes —
# see CLAUDE.md, "Locale Parent Governance", and docs/locale-parent-governance.md.
#
# All steps run every time (continue-on-error on each) so a single PR shows
# every problem at once instead of stopping at the first failure; the final
# step fails the job if any *gating* validator reported an error.

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Every validator step below is `<validator> | tee <name>.log`, and a
    # pipeline's exit status is its LAST command's — `tee` always succeeds, so
    # without pipefail every one of these steps reported success no matter what
    # the validator itself exited with. GitHub's default shell for `run:` is
    # `bash -e {0}`, which has no pipefail; naming `bash` explicitly gets
    # `bash --noprofile --norc -eo pipefail {0}`. Until this was set, the whole
    # gating block below was inert: `steps.<id>.outcome` was 'success'
    # unconditionally, so the "Fail the job" step never fired. Do not remove
    # this without also removing the `| tee` from every step.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # check-translation-parity.js diffs this PR against its base branch,
          # which needs real history — a shallow (depth-1) checkout has no
          # merge-base to diff against.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install

      # First, and gating (no continue-on-error). If a workflow in this repo
      # does not parse, GitHub does not run it and does not report it as
      # failing — it just silently vanishes from the PR's checks, which is how
      # this very file sat dead from 2026-08-07 to 2026-08-08 while PRs merged
      # unchecked. .github/workflows/workflow-lint.yml runs the same script
      # from its own workflow, because a step in here cannot catch THIS file
      # failing to parse. The two cover each other; keep both.
      - name: Lint GitHub Actions workflows
        run: pip install pyyaml >/dev/null && python3 scripts/check-workflows.py

      - name: Run hreflang reciprocity audit
        id: hreflang
        continue-on-error: true
        run: npm run check:hreflang | tee hreflang-audit.log

      - name: Run hreflang cluster completeness audit
        id: hreflang_completeness
        continue-on-error: true
        run: npm run check:hreflang-completeness | tee hreflang-completeness.log

      - name: Run library/symbol page validator
        id: library
        continue-on-error: true
        run: python3 scripts/validate_library_pages.py | tee library-validate.log

      # Whole-site and gating, unlike the other whole-site checks below: this
      # one has no backlog to be permanently red against — the tag either is
      # or isn't in a page's <head>, and scripts/inject-funding-choices-tag.js
      # fixes any gap in one idempotent run. It was previously unwired, which
      # is how 37 pages (27 zh-tw/symbol, 7 vi/library, and the whole
      # free-fire-clan-tag cluster) shipped without ad-blocking-recovery
      # tagging across several unrelated PRs before anyone noticed.
      - name: Run Funding Choices tag check
        id: funding_choices
        continue-on-error: true
        run: npm run check:funding-choices | tee funding-choices.log

      # Gating. Structural validators cannot see a number written in prose or
      # in a <meta>, which is how "LinkedIn cuts at 210" survived the rule
      # changing and how "27 platform limits" stayed in the snippet text long
      # after the table grew to 38. This asserts every figure these pages
      # state still matches js/counter/counterRules.js.
      - name: Run counter claim-consistency check
        id: counter_claims
        continue-on-error: true
        run: npm run check:counter-claims | tee counter-claims.log

      - name: Run image asset check (whole-site audit, informational only)
        id: images
        continue-on-error: true
        run: npm run check:images | tee image-assets.log

      - name: Run new-page image asset check
        id: new_images
        continue-on-error: true
        run: npm run check:new-page-images -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee new-page-images.log

      - name: Run symbol peer-link check (whole-site, informational)
        id: symbol_peer_links_audit
        continue-on-error: true
        run: npm run check:symbol-peer-links | tee symbol-peer-links-audit.log

      - name: Run new-page symbol peer-link check
        id: new_symbol_peer_links
        continue-on-error: true
        run: npm run check:new-symbol-peer-links -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee new-symbol-peer-links.log

      - name: Run translation parity check
        id: parity
        continue-on-error: true
        run: npm run check:translation-parity -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee translation-parity.log

      - name: Run locale mesh check
        id: locale_mesh
        continue-on-error: true
        run: npm run check:locale-mesh -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee locale-mesh.log

      # Whole-site and gating, unlike most whole-site checks here, because its
      # backlog is zero: the 172 tiles that failed it were all repaired in the
      # change that added it. A tile whose label names U+2126 must copy U+2126;
      # NFC silently rewrites that character (and U+212A) to a lookalike, so
      # this cannot be left to vigilance.
      # Structural, and gating for the same reason as the tile codepoint check:
      # zero violations after the change that added it. Catches what a text-level
      # audit structurally cannot — a <head> tag that is not actually in <head>.
      - name: Run document head structure check
        id: document_head
        continue-on-error: true
        run: python3 scripts/check-document-head.py | tee document-head.log

      - name: Run tile codepoint check
        id: tile_codepoints
        continue-on-error: true
        run: python3 scripts/check-tile-codepoints.py | tee tile-codepoints.log

      - name: Run FAQ schema visibility check
        id: faq_schema
        continue-on-error: true
        run: npm run check:faq-schema -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee faq-schema.log

      # Whole-site and gating, like the Funding Choices tag check and unlike the
      # informational whole-site audits: there is no backlog to be permanently
      # red against — a zalgo example card either decodes back to its own label
      # or it does not, and all 72 currently do.
      - name: Run zalgo example decode check
        id: zalgo_decodes
        continue-on-error: true
        run: npm run check:zalgo-decodes | tee zalgo-decodes.log

      # Gating, no backlog: the zalgo generator's pure engine (mark pools,
      # the Thai cascade generator, the unzalgo decoder) is sliced out of the
      # shipped widget by scripts/lib/zalgo-engine.js and asserted headless.
      # The decoder is a Check surface with two promises that a visual check
      # cannot see: a generated Thai stack (one tone mark repeated) is removed,
      # and ordinary Thai (one tone mark per consonant) survives untouched.
      - name: Run zalgo engine tests
        id: zalgo_engine_tests
        continue-on-error: true
        run: npm run test:zalgo-engine | tee zalgo-engine-tests.log

      # Diff-scoped and gating. Fails a PR that corrects a number on one page of
      # an hreflang cluster and leaves a sibling asserting the old value — the
      # 2026-09-01 Unicode 18.0 case, where 13,047 -> 13,007 shipped in English
      # and seven translations kept the old figure for a month with full CI
      # green. Every other gate here measures structure, language, schema or
      # assets; a wrong number passes all of them. Replayed over the last 52
      # commits that touched HTML it fires exactly once, on that commit.
      - name: Run numeric parity check
        id: numeric_parity
        continue-on-error: true
        run: npm run check:numeric-parity -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee numeric-parity.log

      # Whole-pillar and gating, same call as the zalgo check above: no backlog
      # to be permanently red against — all 11 updates/ entries carry exactly
      # one verification date, in the guide-meta pill, so a failure is always a
      # regression this branch introduced. Deliberately NOT diff-scoped: the
      # shape this catches is an older page drifting out of agreement with a
      # convention set later, which a diff-scoped check cannot see.
      - name: Run updates verification-date check
        id: updates_verification
        continue-on-error: true
        run: npm run check:updates-verification | tee updates-verification.log

      # Source attribution: a page that cites an external source presents it in
      # one Sources block, with each citation's rel set by the cited domain's
      # authority tier (data/source_authority.json). Diff-scoped, because 32
      # pages carried citations with no block when this landed and that backlog
      # is written prose, not a mechanical fix. It GATES rather than informs:
      # for the pages a PR actually touches there is nothing to be permanently
      # red against, and fix-source-attribution.js closes the mechanical half.
      - name: Run source attribution check
        id: source_attribution
        continue-on-error: true
        run: npm run check:source-attribution -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee source-attribution.log

      - name: Run locale translation completeness check
        id: locale_translation
        continue-on-error: true
        run: npm run check:locale-translation -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee locale-translation.log

      - name: Run library hub parity check
        id: library_hub_parity
        continue-on-error: true
        run: npm run check:library-hub-parity -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee library-hub-parity.log

      - name: Run locale parent gap check
        id: locale_parent_gap
        continue-on-error: true
        run: npm run check:locale-parent-gap -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee locale-parent-gap.log

      - name: Run locale parent gap audit (whole-site, informational)
        id: locale_parent_gap_audit
        continue-on-error: true
        run: npm run audit:locale-parent-gap | tee locale-parent-gap-audit.log

      # Validates every locale SPEC against its live EN parent before any HTML
      # exists — tile parity, hreflang self-reference, related links resolving
      # on disk, duplicate claimants. Whole-set rather than diff-scoped: the
      # spec set is small and every check is relative to the EN parent, so it
      # cannot go permanently red on backlog the way check:images does.
      - name: Run locale spec check
        id: locale_spec
        continue-on-error: true
        run: npm run check:locale-spec | tee locale-spec.log

      # A locale PAGE must carry its EN parent's combo-set section. That section
      # renders at runtime through buildGrids(), so it leaves no static markup
      # and every other gate here is blind to it — 43 locale pages shipped
      # without it while passing all of them. Diff-scoped, unlike the spec
      # check above, because a real backlog exists (61 pages missing the
      # section, 32 short or long on groups) and a permanently red check is one
      # people learn to ignore. The two are not redundant: the spec check stops
      # a bad page being GENERATED and only sees the 327 pages that have a
      # spec; this one stops a bad page being SHIPPED and sees all 798.
      - name: Run locale combo-set parity check
        id: locale_collection_parity
        continue-on-error: true
        run: npm run check:locale-collection-parity | tee locale-collection-parity.log

      - name: Run external-reference check
        id: external_refs
        continue-on-error: true
        run: npm run check:external-refs | tee external-refs.log

      # Whole-site and gating, for the same reason as the tile-codepoint and
      # document-head checks above: its backlog is zero, because the change
      # that added it baked the footer into all 4,582 pages at once.
      #
      # The footer is the site's densest block of internal links (~27 per page,
      # in the visitor's own language) and it used to exist only at runtime —
      # footer.js filled an empty shell on load. Googlebot renders JS and saw
      # them; GPTBot/ClaudeBot/Amazonbot/Google-Extended/meta-externalagent,
      # which robots.txt explicitly invites, do a plain fetch and saw none.
      # scripts/build-static-footer.js bakes footer.js's own output into the
      # HTML, so now that the markup is committed, editing footer.js no longer
      # reaches the pages — this is what catches that drift.
      #
      # It also guards scripts/fix-footer-nested-content.py's repair: page
      # content nested inside <footer> (727 pages carried whole FAQ sections
      # there, where readability-style extractors discard it as boilerplate)
      # is by definition a deviation from the generated markup, so it fails
      # here too. Fix is always `npm run build:static-footer`.
      - name: Run static footer check
        id: static_footer
        continue-on-error: true
        run: npm run check:static-footer | tee static-footer.log
      # Gating, and with no backlog to be red against: the accent notice's copy
      # either matches data/accent_notice_copy.json or it doesn't, and
      # `npm run build:accent-notice` closes any gap in one idempotent run. The
      # sentence is one string per locale baked onto ~200 pages, so a page
      # edited by hand — or a page added with no notice at all — drifts
      # silently otherwise. The check also fails on a generator page whose
      # input wrapper it cannot place the block around, rather than patching
      # blind.
      - name: Run accent notice check
        id: accent_notice
        continue-on-error: true
        run: npm run check:accent-notice | tee accent-notice.log
      # Gating, and with no backlog to be red against: library/index.html's
      # static directory either matches its own LIBRARY array or it doesn't,
      # and `npm run build:library-directory` closes any gap in one idempotent
      # run. The hub's 336 spoke links are the only thing a non-JS crawler
      # (GPTBot, ClaudeBot, Amazonbot, meta-externalagent, Google-Extended)
      # can see, so an entry added to the array without regenerating would
      # silently go uncrawlable.
      - name: Run library directory freshness check
        id: library_directory
        continue-on-error: true
        run: npm run check:library-directory | tee library-directory.log

      # The locale directory hubs are pre-rendered so a non-rendering crawler
      # sees their links. This step used to run check:locale-library-directory,
      # which reads a `const LIBRARY = [...]` array — a format every locale hub
      # migrated away from. All 19 skipped, it exited 0, and it printed "All
      # locale library hubs are pre-rendered and current." The gate had been
      # verifying nothing for as long as the new format has been live: the
      # third instance in this repo of "a check that reports nothing is
      # indistinguishable from a check that passes."
      #
      # scripts/build-library-hub.js reads window.UTG_LIBRARY_HUB, which is
      # what the hubs actually carry, and exits 1 on drift. Wiring it here
      # immediately caught real staleness in ko/library/index.html.
      # build-locale-library-directory.js now fails loudly if it ever skips
      # every target again, rather than reporting success.
      - name: Run locale library hub freshness check
        id: locale_library_directory
        continue-on-error: true
        run: npm run check:library-hub | tee locale-library-directory.log

      # Library hub coverage — the DIFF-SCOPED gate. A page can ship correct in
      # every other respect (indexable, self-canonical, meshed, in the sitemap)
      # and still be absent from the hub that is supposed to be its front door;
      # 374 pages were in exactly that state when this was written, 210 of them
      # in `es`. Diff-scoped for the same reason as check:translation-parity —
      # a whole-site check would be red on every PR regardless of what the PR
      # did, and a permanently-red check is one people learn to ignore.
      - name: Run library hub coverage check
        id: library_hub_coverage
        continue-on-error: true
        run: npm run check:library-hub-coverage -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee library-hub-coverage.log

      # Whole-site hub coverage picture — informational only, same call as the
      # image and locale-parent-gap audits: it reports the standing backlog the
      # gate above deliberately does not count against any single branch.
      - name: Run library hub coverage audit (whole-site, informational)
        id: library_hub_coverage_audit
        continue-on-error: true
        run: npm run audit:library-hub-coverage | tee library-hub-coverage-audit.log

      # Editorial Footprint Risk — SHADOW MODE, and deliberately not in the
      # gating list below. It reports what it WOULD fail on and exits 0.
      #
      # Two reasons it starts here rather than gating. First, the backlog is
      # total: 52,766 em dashes across 98.9% of pages, and one shared CTA card
      # on 46.6% of English pages — and most of that is generated, with 6,918
      # em dashes hardcoded across 572 spec files and 116 generator scripts, so
      # the fix is upstream and not in the HTML a PR touches. Second, this
      # repository has twice shipped a check that reported nothing and was
      # indistinguishable from one that passed; the cure is to watch a rule fire
      # on real pull requests before trusting it, not to switch it on and hope.
      #
      # Its two deterministic rules (model/tooling leakage, and the SEO
      # Preservation Gate) already exit 1 under --enforce and have been verified
      # against deliberately broken inputs. Promotion to gating is a documented
      # step in docs/editorial-footprint-risk.md, not a silent flag flip.
      #
      # `--annotations` emits GitHub file/line annotations so findings appear on
      # the diff rather than only in this log.
      #
      # ONE RULE GATES (2026-09-02, user decision): the em dash is banned on
      # new or changed copy, forward-only and PER LOCALE, from
      # data/em_dash_locale_policy.json — English and the thirteen en-dash
      # locales ban outright, zh-tw and ja ban a lone dash, six native-dash
      # locales are never flagged, nine warn pending a native reader. The
      # spaced hyphen is banned on English. The script exits 1 only when a
      # branch INTRODUCES a banned dash, whatever mode it runs in; every other
      # rule stays shadow. That is why this step is in the gating list below
      # while still being labelled shadow mode: existing em dashes are reported
      # and never billed. Table and decision: docs/em-dash-policy.md.
      - name: Run editorial footprint check (shadow mode; em dash policy enforced per locale)
        id: editorial_footprint
        continue-on-error: true
        run: npm run check:editorial-footprint -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} --annotations | tee editorial-footprint.log

      # Gating, and with no backlog to be red against: these are unit tests over
      # fixtures, not a measurement of the site. They encode the false positives
      # this system actually produced (a quoted em dash, the em dash on the page
      # ABOUT the em dash, the character "underscore" in username rules) so a
      # future edit cannot silently reintroduce them.
      - name: Run editorial footprint tests
        id: editorial_footprint_tests
        continue-on-error: true
        run: npm run test:editorial-footprint | tee editorial-footprint-tests.log

      # EFR Quality Gate — diff-scoped and GATING, unlike the shadow-mode check
      # above, and the two are different questions. check-editorial-footprint
      # asks "did this branch introduce a forbidden pattern or an SEO loss";
      # this asks "did this branch move an /updates/ or /guide/ page's overall
      # EFR score the wrong way against its section's PASS threshold" — a
      # RATCHET, never a state check: a new page must meet PASS, an existing
      # PASS page may not be pushed above it, an existing page above PASS may
      # not get materially worse (+0.5), and an improvement bought by deleting
      # facts or internal links is IMPROVED BY REMOVAL, not credited. The 13
      # English guides above target on the day it was wired never count
      # against a branch that does not touch them. Both sides of every diff
      # are scored in one corpus so the delta is the page's own change.
      # Thresholds, the exception ledger (data/efr_exceptions.json) and the
      # editor playbook: docs/efr-quality-gate.md. Verified against seven
      # deliberately broken inputs before being added to the gating list.
      - name: Run EFR quality gate (updates/guide, ratcheted)
        id: efr_gate
        continue-on-error: true
        run: npm run check:efr -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} --annotations | tee efr-gate.log

      # Gating, zero backlog: unit tests over the gate's own policy — threshold
      # boundaries, every ratchet outcome, every exception state, and the
      # worked example (11.5 -> 8.2 is an improvement still above target, not
      # the same as 11.5 -> 12.5).
      - name: Run EFR quality gate tests
        id: efr_tests
        continue-on-error: true
        run: npm run test:efr | tee efr-tests.log
      # Gating, no backlog: fixtures for the sitemap's significance hash, the
      # rule that decides whether a page's <lastmod> advances. It encodes the
      # two mass-bumps this repo actually produced (the site-wide static footer
      # on 2026-08-20, the template-tier punctuation pass on 2026-09-02) as
      # NON-catches, and the changes a reader can see as catches, so a future
      # edit cannot silently re-enable either failure.
      - name: Run content-significance tests
        id: content_significance_tests
        continue-on-error: true
        run: npm run test:content-significance | tee content-significance-tests.log

      # Diff-scoped and GATING. Page copy is hand-written once per spec in
      # data/library_page_specs/, and nothing compared those specs to each
      # other: 45 sentences repeat across more than one spec and 416 of 591
      # specs carry at least one. The worst is a hero_tagline on 181 specs, and
      # a meta_description duplicated across 91 is an SEO defect, not only an
      # editorial one. That backlog is REPORTED, never failed — only a spec this
      # branch adds or changes can fail, and only when it copies a sentence
      # already in 3+ other specs. `--audit` gives the whole-corpus picture.
      - name: Run spec sentence-reuse check
        id: spec_sentence_reuse
        continue-on-error: true
        run: npm run check:spec-sentence-reuse -- --base origin/${{ github.event.pull_request.base.ref || 'main' }} | tee spec-sentence-reuse.log

      # Gating, zero backlog: unit tests over fixtures. Guards the four
      # printables generators, which are FULL regenerators and were measured
      # deleting five later site-wide repairs (Funding Choices tag, static
      # footer, the FAQ's position in <main>, hreflang alternates, social image
      # tags) from 90 live pages in one unmodified run.
      - name: Run generator parity tests
        id: generator_parity_tests
        continue-on-error: true
        run: npm run test:generator-parity | tee generator-parity-tests.log

      # Gating, zero backlog: unit tests over fixtures for the check above. The
      # first specification of that check compared whole FIELDS, and the corpus
      # has zero duplicate hero_tagline/meta_description/title/intro values — it
      # would have shipped a gate that could never fire. Several cases pin the
      # sentence-level granularity down, and the NON-catches pin the delta rule
      # that keeps the 416-spec backlog reported rather than failed.
      - name: Run spec sentence-reuse tests
        id: spec_sentence_reuse_tests
        continue-on-error: true
        run: npm run test:spec-sentence-reuse | tee spec-sentence-reuse-tests.log

      # Gating, zero backlog: unit tests over the analytics classifiers in
      # header.js. Two concerns, both of which decide what every future number
      # from them means:
      #
      #   · the cta_click pair, each carrying a real trap — /js/ is a genuine
      #     two-letter top-level directory and is not a locale, and a pillar
      #     index is a different answer from a page inside that pillar;
      #   · the copy_text identity engine, whose Unicode block table is a
      #     factual assertion about encodings. Its whole-site case is
      #     self-maintaining: ship a page in a script the table does not cover
      #     and this goes red, instead of that page's copies arriving as
      #     "Other".
      #
      # The test SLICES both out of the live header.js rather than
      # reimplementing them, the same technique check-zalgo-decodes.js uses for
      # generateZalgo().
      - name: Run header.js analytics tests
        id: header_analytics_tests
        continue-on-error: true
        run: npm run test:header-analytics | tee header-analytics-tests.log

      # Gating, zero backlog: unit tests over the CTA routing table and the
      # in-place pass that applies it. Three things they pin down, each a
      # silent defect rather than a crash: no <lang>/ page may ever route (no
      # locale build of any destination tool exists, and linking an English
      # tool from a locale page is what the locale-native rule forbids); the
      # pass is idempotent and never reclaims a card already pointed somewhere
      # specific; and the card copy quotes limits read back out of
      # js/counter/counterRules.js, so it cannot drift from the tool it
      # describes.
      - name: Run CTA routing tests
        id: cta_routing_tests
        continue-on-error: true
        run: npm run test:cta-routing | tee cta-routing-tests.log

