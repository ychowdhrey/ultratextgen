name: Stranded work

# Finds branches carrying work that no open PR tracks — finished, gate-passing,
# and never reaching `main` because a merged PR cannot track new work — and
# keeps one recovery issue (label `stranded-work`) per stranded branch.
#
# NOT a PR gate, deliberately. It runs on a schedule and fails its own run,
# visible in the Actions tab without blocking anyone's merge. It fails only on
# something NEW: a stranded branch with no recovery issue, an issue closed while
# its work is still stranded, new commits on a stranded branch, or a branch new
# to the pre-rewrite list. The known backlog lives in its open issues and is
# reported every run without turning it red; an issue closes itself once its
# branch is merged, tracked by an open PR, landed by content, or excluded in
# data/stranded_work_exclusions.json. (Before 2026-11-11 the run was red every
# day: first on the whole backlog, then on 381 "unmeasurable" branches that were
# in fact cut before main's 2026-07-10 history rewrite and so shared no commit
# with main on any clone. They are measured by content now.)
#
# Recovery stage (2026-11-17). Every run also qualifies each stranded branch: a deterministic
# decision record (scripts/lib/stranded_work.py, qualify) that is written into its task and kept
# as the run's artifact. A branch that passes every check (docs only, small, merges cleanly,
# overwrites nothing newer, no decision, no PR ever closed unmerged, nothing on main citing it) may
# get a DRAFT PR from the branch as it stands. That step runs only when the repository variable
# STRANDED_AUTO_RECOVERY is 'true'; otherwise the run lists what it would open. A PR opened with
# GITHUB_TOKEN starts no workflow run, so its gates run when a person marks it ready or pushes to
# it. Nothing here merges, and an open or draft PR never closes a task: main having the work does.
#
# fetch-depth: 0 is load-bearing, not hygiene. On a shallow checkout
# `git merge-base` cannot resolve a common ancestor for most branches, and a
# naive count then reports a branch's entire history as unmerged. The script
# reports those as UNMEASURABLE (exit 3) rather than clean.

on:
  schedule:
    - cron: '0 7 * * *'   # daily, 07:00 UTC — after the Monday digest's 06:00
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # read open/closed PRs; open qualified draft recovery PRs (switched off by default)
  issues: write        # recovery tasks: create, reopen, update, close

# Two overlapping runs would plan from the same issue list and both act on it. Queue, never cancel:
# a cancelled apply step can leave half a plan applied, which the next run repairs but should not have to.
concurrency:
  group: stranded-work
  cancel-in-progress: false

jobs:
  stranded-work:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (full history — see header)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every remote branch
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check for untracked work
        id: stranded
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --json number,headRefName,isDraft,body --limit 300 \
            > open-prs.json
          # Closed PRs, all of them (a truncated list would hide an old rejection): one closed unmerged from a
          # branch blocks its automated recovery.
          gh pr list --state closed --json number,headRefName,mergedAt --limit 5000 \
            > closed-prs.json
          # Idempotent. Listing by a label that does not exist yet must not be what fails the very first run.
          gh label create stranded-work --force --color B60205 \
            --description 'Work on a branch that no open PR tracks (daily Stranded work run)'
          gh issue list --label stranded-work --state all --json number,state,body --limit 500 \
            > tasks.json
          python3 scripts/check-stranded-work.py --open-prs open-prs.json --closed-prs closed-prs.json \
            --tasks tasks.json --plan-out stranded-plan.json --decisions-out stranded-decisions.json \
            | tee stranded-work.log

      # Runs whatever the check concluded: a red run still files its tasks, a green one still closes resolved ones.
      - name: Apply recovery tasks
        id: tasks
        if: always() && hashFiles('stranded-plan.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_RECOVERY: ${{ vars.STRANDED_AUTO_RECOVERY }}
        run: |
          flag=()
          if [ "$AUTO_RECOVERY" = "true" ]; then flag=(--recover); fi
          python3 scripts/apply-stranded-work-tasks.py stranded-plan.json "${flag[@]}" | tee stranded-tasks.log

      - name: Keep the decision record
        if: always() && hashFiles('stranded-decisions.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: stranded-work-decisions
          path: |
            stranded-decisions.json
            stranded-plan.json
            stranded-work.log
          retention-days: 90

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Stranded work — \`${{ steps.stranded.outcome }}\`"
            echo '```'
            cat stranded-work.log || echo "(no output — the check did not run)"
            echo '```'
            echo "### Recovery tasks — \`${{ steps.tasks.outcome }}\`"
            echo '```'
            cat stranded-tasks.log 2>/dev/null || echo "(not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run on newly stranded work, or if the tasks could not be filed
        if: steps.stranded.outcome == 'failure' || steps.tasks.outcome == 'failure'
        run: |
          echo "check: ${{ steps.stranded.outcome }} · recovery tasks: ${{ steps.tasks.outcome }} — see the summary."
          exit 1
