name: Update Sitemap

on:
  # ── RESUMED 2026-09-05, by explicit user direction ────────────────────────
  #
  # The daily schedule below was paused 2026-08-20 and is live again. History
  # kept rather than deleted, per the repo's record-hygiene rule.
  #
  # Why it was paused: organic search collapsed on 2026-08-16 with the cause
  # still open, and PR #790 (the static footer on all 4,582 pages) meant the
  # next run would advance <lastmod> on 4,576 of 4,576 URLs — advertising "the
  # entire site changed today" mid-incident. Measured at the time:
  #     lastmod advanced: 4576   lastmod held: 0
  #
  # Why it resumes now — three conditions, all met:
  #
  #   1. The mass-bump is fixed (see the 2026-09-02 addendum that used to sit
  #      here). scripts/lib/content-significance.js now ignores the generated
  #      static footer block and is punctuation-blind and case-folded on
  #      visible text, title, H1 and meta description; symbols and copy
  #      payloads stay verbatim. data/sitemap-lastmod-cache.json was
  #      re-baselined against the last run's tree (df1f93e7f). Measured on
  #      that tree pair, not assumed:
  #          old hash: 4576 advance · footer ignored: 3236 · final: 784 advance
  #      The 784 are pages a reader can genuinely see changed, each dated by
  #      the newest commit that changed what a reader sees. The signal this
  #      workflow would now send is honest, so the reason to hold it is gone.
  #
  #   2. The pause's own premise expired. Its stated resume date was
  #      2026-08-27. More importantly the publishing freeze it belonged to was
  #      lifted site-wide on 2026-08-29 by explicit user direction, so the
  #      diagnostic control group it was protecting no longer exists — holding
  #      the sitemap now buys nothing it was meant to buy.
  #
  #   3. The pause had an unaccounted cost on the channel that now matters
  #      most. It throttles sitemap announcements to Bing, Naver and Yandex,
  #      not just Google — and the 2026-08-28 portfolio decision made Bing a
  #      primary surface (~4.7x Google's RPM over the measured 7-day window).
  #      By 2026-09-05 the newest <lastmod> in sitemap.xml was 2026-08-19:
  #      16 days of real changes unannounced to every engine, including
  #      everything shipped after the freeze lifted.
  #
  # Note the pause's own cost estimate was Google-only ("Pausing costs very
  # little" — reasoned from Google Crawl Stats refresh rates). That reasoning
  # did not cover the other three engines, and is the specific gap condition 3
  # closes.
  #
  schedule:
    - cron: '0 0 * * *'  # every day at midnight UTC
  workflow_dispatch:

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history needed for git log lastmod dates

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # --submit-indexnow announces ONLY the URLs whose <lastmod> this run
      # advanced, to Bing/Naver/Seznam/Yandex/Yep via api.indexnow.org. It runs
      # after the sitemap and cache are written and can never fail this job.
      #
      # This replaced Cloudflare Crawler Hints on 2026-09-13 (user decision).
      # Crawler Hints fires on CACHE state, so it had been announcing ~1,398
      # URLs/day on a 4,679-URL site — the whole site every 3.3 days — against
      # a real change rate of zero on a typical day. Bing's July 2025 sitemap
      # guidance is explicit that inflating freshness signals backfires.
      #
      # DISABLE CRAWLER HINTS IN CLOUDFLARE (Caching -> Configuration) or the
      # two submitters run side by side and the noisy one wins.
      #
      # The flag is opt-in per run, so `npm run prebuild` locally never
      # announces. See scripts/lib/indexnow.js for the mass-bump ceiling.
      - name: Run sitemap generator
        run: node scripts/update-sitemap.js --submit-indexnow

      - name: Commit updated sitemap.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The cache must be committed alongside the sitemap. The generator
          # writes it every run; if only sitemap.xml is staged, the cache is
          # silently discarded and every later run compares against a frozen
          # snapshot instead of the previous run's state.
          git add sitemap.xml data/sitemap-lastmod-cache.json
          git diff --cached --quiet || git commit -m "chore: regenerate sitemap.xml [skip ci]"
          git push
