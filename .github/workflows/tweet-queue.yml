name: Commit to Tweet Queue

on:
  workflow_dispatch:
    inputs:
      commits_to_inspect:
        description: 'Number of recent commits to inspect'
        required: false
        default: '20'
  # ── PAUSED 2026-10-09, by explicit user direction ─────────────────────────
  #
  # The daily schedule (`cron: '0 9 * * *'`, 09:00 UTC) is switched off. Each
  # run pushed a `chore: update tweet-queue state [skip ci]` commit to the
  # default branch, which notified every watcher of the repo once a day.
  #
  # Kept rather than deleted, per the repo's record-hygiene rule. To resume,
  # restore the two lines below. Manual runs via workflow_dispatch above still
  # work, and `.tweet-queue-state.json` still marks the last commit processed.
  #
  # schedule:
  #   - cron: '0 9 * * *' # daily at 09:00 UTC

jobs:
  tweet-queue:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Run tweet queue script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          COMMITS="${{ github.event.inputs.commits_to_inspect }}"
          COMMITS="${COMMITS:-20}"
          python scripts/tweet_queue.py --commits "$COMMITS"
