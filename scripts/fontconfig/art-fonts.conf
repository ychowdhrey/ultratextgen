<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The font mapping the committed page art was drawn with.

  SERIF in scripts/generate-site-art.py names Georgia first. Georgia is not
  installed, so fontconfig substitutes, and WHICH face it picks depends on
  what else is installed: with only fonts-dejavu it is DejaVu Serif (the
  committed cards; measured 2026-09-27, English serif cards re-render
  pixel-identical), but installing fonts-noto-core, which the Thai, Arabic
  and Devanagari cards need, silently turns it into Noto Serif and changes
  every serif motif a run touches.

  Use it for every art run:
    FONTCONFIG_FILE=$PWD/scripts/fontconfig/art-fonts.conf python3 scripts/generate-site-art.py ...
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Serif</string></edit>
  </match>
</fontconfig>
